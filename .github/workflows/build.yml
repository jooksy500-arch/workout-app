name: Build Workout.ipa
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Workout.xcodeproj -scheme Workout -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
      - name: Ad-hoc sign with HealthKit entitlement and package
        run: |
          APP=build/Build/Products/Release-iphoneos/Workout.app
          codesign --force --deep -s - --entitlements Workout.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Workout.ipa Payload
          ls -la Workout.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Workout-ipa
          path: Workout.ipa
